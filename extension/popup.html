<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jenvu</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2e;
    --panel-2: #0f1729;
    --border: rgba(255,255,255,0.08);
    --text: #e5e7eb;
    --muted: #94a3b8;
    --brand: #10b981;
    --brand-2: #059669;
    --danger: #ef4444;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 340px;
    margin: 0;
    padding: 0;
    background: linear-gradient(180deg, #0b1220 0%, #0a0f1e 100%);
    color: var(--text);
    font-family: "Google Sans", "Product Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 14px 14px 16px; }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .brand-dot {
    width: 22px; height: 22px; border-radius: 6px;
    background: radial-gradient(circle at 30% 30%, #34d399, #059669 60%, #064e3b);
    box-shadow: 0 0 12px rgba(16,185,129,0.45);
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; flex: 1; }
  h1 .v { font-size: 10px; font-weight: 500; color: var(--muted); background: rgba(148,163,184,0.12); padding: 2px 7px; border-radius: 999px; }
  p.lead { font-size: 11px; color: var(--muted); margin: 6px 0 12px; line-height: 1.45; }
  label { font-size: 11px; color: #cbd5e1; display: block; margin-top: 10px; font-weight: 500; }
  input, select {
    width: 100%; padding: 9px 11px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit; font-size: 12px; margin-top: 5px;
    outline: none; transition: border-color .15s;
  }
  input:focus, select:focus { border-color: var(--brand); }
  button {
    margin-top: 10px; width: 100%; padding: 10px 12px;
    border: 0; border-radius: 8px;
    background: linear-gradient(180deg, #10b981, #059669);
    color: #fff; font-size: 13px; font-weight: 600;
    font-family: inherit;
    cursor: pointer; transition: transform .05s, filter .15s;
    box-shadow: 0 4px 14px rgba(16,185,129,0.25);
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: not-allowed; filter: grayscale(0.4); box-shadow: none; }
  button.secondary {
    background: rgba(148,163,184,0.14); color: var(--text); box-shadow: none;
    border: 1px solid var(--border);
  }
  button.analyze {
    background: linear-gradient(180deg, #3b82f6, #2563eb);
    box-shadow: 0 4px 14px rgba(37,99,235,0.35);
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .status {
    margin-top: 12px; padding: 9px 11px; font-size: 11px; border-radius: 8px;
    background: rgba(148,163,184,0.08); color: #cbd5e1;
    border: 1px solid var(--border);
  }
  .status.ok { background: rgba(16,185,129,0.12); color: #6ee7b7; border-color: rgba(16,185,129,0.25); }
  .status.err { background: rgba(239,68,68,0.12); color: #fca5a5; border-color: rgba(239,68,68,0.3); }
  .sig {
    margin-top: 12px; padding: 12px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 12px; background: var(--panel-2);
  }
  .sig b { font-weight: 600; color: #fff; }
  .sig .row2 { display: flex; justify-content: space-between; margin-top: 4px; color: #cbd5e1; }
  .muted { color: var(--muted); font-size: 10px; }
  a { color: #38bdf8; text-decoration: none; font-size: 11px; }
  a:hover { text-decoration: underline; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0 4px; }
  .toggle {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; font-size: 11px; color: #cbd5e1;
    padding: 8px 10px; background: rgba(148,163,184,0.06);
    border-radius: 8px; border: 1px solid var(--border);
  }
  .toggle input { width: auto; margin: 0; }
  .chip { font-size: 10px; padding: 2px 7px; border-radius: 999px; background: rgba(56,189,248,0.15); color: #7dd3fc; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="brand-dot"></span>
    <h1>Jenvu · TradingView <span class="v">v1.2</span></h1>
  </div>
  <p class="lead">Live ICT/SMC walkthrough — HTF bias, BOS/CHoCH, FVG, order blocks, liquidity, and Entry/SL/TP drawn step by step on your chart.</p>

  <label>API endpoint
    <select id="endpoint">
      <option value="https://jenvu.com">jenvu.com (production)</option>
      <option value="https://jenvuo.lovable.app">jenvuo.lovable.app (staging)</option>
      <option value="custom">Custom URL…</option>
    </select>
  </label>
  <input id="customEndpoint" placeholder="https://your-preview.lovable.app" style="display:none">

  <label>Access token
    <input id="token" type="password" placeholder="jext_..." autocomplete="off" />
  </label>

  <div class="row">
    <button id="save">Connect</button>
    <button id="test" class="secondary">Test</button>
  </div>

  <div class="toggle">
    <span>Auto-open TradingView on new signal</span>
    <input id="autoOpen" type="checkbox" />
  </div>

  <hr />

  <label>Analyze pair now <span class="chip">$0.20</span>
    <select id="pair">
      <option value="XAUUSD">XAU/USD · Gold</option>
      <option value="XAUEUR">XAU/EUR</option>
      <option value="XAUGBP">XAU/GBP</option>
      <option value="XAUJPY">XAU/JPY</option>
      <option value="XAUAUD">XAU/AUD</option>
      <option value="XAUCHF">XAU/CHF</option>
    </select>
  </label>
  <button id="analyze" class="analyze">Analyze on TradingView</button>

  <div id="status" class="status">Not connected.</div>
  <div id="signal" class="sig" style="display:none"></div>

  <p style="margin-top:14px; text-align:center" class="muted">
    Get your token → <a href="https://jenvu.com/dashboard/extension" target="_blank">jenvu.com/dashboard/extension</a>
  </p>
</div>

<script src="popup.js"></script>
</body>
</html>
