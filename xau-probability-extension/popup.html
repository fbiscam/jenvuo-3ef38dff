<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jenvu Gold Probability</title>
  <link rel="stylesheet" href="panel.css" />
  <style>body{margin:0;width:360px;min-height:560px;background:#000}</style>
</head>
<body>
  <header class="nc-bar"><span class="nc-title"><img class="nc-logo" src="icon.png" alt="Jenvu"/><span class="nc-dot"></span>Jenvu Probability</span><button class="nc-theme" id="theme" title="Switch theme">◐</button></header>
  <div class="nc-controls"><input id="pair" value="XAUUSD" disabled aria-label="Instrument"/><select id="tf" aria-label="Timeframe"><option value="5m" selected>5m</option><option value="15m">15m</option><option value="1h">1h</option><option value="4h">4h</option></select></div>
  <main class="nc-root" id="root"><div class="nc-loading"><span class="nc-spin"></span>Loading completed Gold candles…</div></main>
  <script src="engine.js"></script><script src="ui.js"></script><script src="popup.js"></script>
</body>
</html>
